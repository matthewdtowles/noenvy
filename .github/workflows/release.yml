name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          # RELEASE_PAT (fine-scoped PAT with contents:write) instead of the
          # built-in GITHUB_TOKEN. Actions triggered by GITHUB_TOKEN do not
          # fire other workflows, so a release published via GITHUB_TOKEN
          # would not trigger apt-repo.yml. A PAT belongs to a user, so the
          # release:published event propagates and downstream workflows run.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
